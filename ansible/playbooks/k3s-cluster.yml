---
- name: Install k3s server on control-plane
  hosts: control_plane
  become: true

  tasks:
    - name: Download and run k3s install script (server mode)
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | sh -s - server \
          --write-kubeconfig-mode 644 \
          --tls-san {{ ansible_host }}
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for node-token file to exist
      ansible.builtin.wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        state: present
        timeout: 60

    - name: Read the join token
      ansible.builtin.slurp:
        src: /var/lib/rancher/k3s/server/node-token
      register: node_token_raw

    - name: Store token as a fact for other hosts to use
      ansible.builtin.set_fact:
        k3s_token: "{{ node_token_raw.content | b64decode | trim }}"

- name: Install k3s agent on worker nodes
  hosts: workers
  become: true

  vars:
    control_plane_ip: "{{ hostvars[groups['control_plane'][0]]['ansible_host'] }}"
    k3s_join_token: "{{ hostvars[groups['control_plane'][0]]['k3s_token'] }}"

  tasks:
    - name: Download and run k3s install script (agent mode)
      ansible.builtin.shell: |
        curl -sfL https://get.k3s.io | K3S_URL=https://{{ control_plane_ip }}:6443 \
          K3S_TOKEN={{ k3s_join_token }} sh -s -
      args:
        creates: /usr/local/bin/k3s-agent
